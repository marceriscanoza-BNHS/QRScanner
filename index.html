<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.M.A.R.T. – Student Monitoring & Accountability Record Tracker</title>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 10px; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h3 { margin-top: 0; font-size: 1.1em; border-bottom: 1px solid #eee; padding-bottom: 8px; color: #0056b3; }
        button { width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin: 5px 0; font-size: 14px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        
        #reader { width: 100%; border-radius: 12px; background: #000; margin-top: 10px; overflow: hidden; }
        .result-box { background: #fff; padding: 15px; border-radius: 10px; margin-top: 10px; border: 2px solid #007bff; }
        #status { font-weight: bold; margin-bottom: 10px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; }
        
        .search-row { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-row input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        .search-row button { width: auto; padding: 0 20px; }
        
        #searchList { max-height: 200px; overflow-y: auto; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px; display: none; border: 1px solid #ddd; }
        .search-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

    <div id="status">Checking Database...</div>

    <div class="card">
        <h3>Manual Search</h3>
        <div class="search-row">
            <input type="text" id="nameInput" placeholder="Enter student name...">
            <button class="btn-primary" onclick="performSearch()">Search</button>
        </div>
        <div id="searchList"></div>
    </div>

    <div class="card">
        <h3>QR Scanner</h3>
        <button id="startBtn" class="btn-primary" onclick="initScanner()">Open Camera</button>
        <div id="reader"></div>

        <div id="scanResult" style="display:none;" class="result-box">
            <p style="margin:0; color:#666; font-size:11px;">STUDENT IDENTIFIED:</p>
            <p style="font-size: 18px; font-weight: bold; margin: 5px 0; color: #000;"><span id="nameText"></span></p>
            <p style="margin: 0 0 15px 0; font-size:14px; color: #444; font-weight: 500;"><span id="infoText"></span></p>
            
            <label style="font-size: 12px; font-weight: bold;">Violation:</label>
            <select id="violationType" style="width:100%; padding:12px; margin:10px 0; border-radius:8px;">
                <option value="Improper Haircut">Improper Haircut</option>
                <option value="Improper Uniform">Improper Uniform</option>
                <option value="No ID">No ID Card</option>
                <option value="Late">Tardiness</option>
                <option value="Make Up">Excessive Make Up</option>
                <option value="Others">Others</option>
            </select>
            <button class="btn-success" onclick="saveRecord()">Confirm & Save</button>
            <button class="btn-secondary" onclick="cancelScan()">Cancel</button>
        </div>
    </div>

    <div class="card">
        <h3>Recent History</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>Name</th><th>Section</th><th>Violation</th><th>Time</th></tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h3>Data Management</h3>
        <button class="btn-success" onclick="exportData()">Extract Report (Excel)</button>
        <button class="btn-danger" onclick="clearLogs()">Reset Violations</button>
        <hr>
        <p style="font-size: 11px; margin-bottom: 5px; font-weight: bold;">Upload Roster (CSV):</p>
        <input type="file" id="csvFile" accept=".csv" style="font-size: 11px; margin-bottom: 10px;">
        <button class="btn-secondary" onclick="uploadCSV()">Update Roster</button>
    </div>

    <script>
        const db = new Dexie("StudentTrackerDB");
        db.version(1).stores({
            students: "LRN, Name, Grade, Section",
            logs: "++id, LRN, Name, Grade, Section, violation, timestamp"
        });

        let scanner = null;
        let activeStudent = null;
        let audioCtx = null;

        function playSound(mode) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (mode === 'scan') {
                // High-pitch "Scan" Beep + Vibrate
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                if ("vibrate" in navigator) navigator.vibrate(200);
            } else if (mode === 'save') {
                // Lower "Confirm" Sound, No Vibration
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else {
                // Error Sound
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        document.addEventListener("DOMContentLoaded", refreshUI);

        async function refreshUI() {
            const studentCount = await db.students.count();
            const logCount = await db.logs.count();
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = studentCount > 0 ? `✅ READY: ${studentCount} Students | ${logCount} Logs` : `⚠️ NO ROSTER: Upload CSV`;
            statusDiv.style.background = studentCount > 0 ? "#d4edda" : "#fff3cd";

            const lastLogs = await db.logs.reverse().limit(5).toArray();
            document.getElementById('historyBody').innerHTML = lastLogs.map(log => `
                <tr>
                    <td>${log.Name}</td>
                    <td>${log.Section}</td>
                    <td>${log.violation}</td>
                    <td>${new Date(log.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                </tr>
            `).join('');
        }

        async function performSearch() {
            const query = document.getElementById('nameInput').value.trim().toLowerCase();
            const listDiv = document.getElementById('searchList');
            if (query.length < 2) return;

            const matches = await db.students.filter(s => s.Name.toLowerCase().includes(query)).limit(15).toArray();

            if (matches.length > 0) {
                listDiv.style.display = 'block';
                listDiv.innerHTML = matches.map(s => `
                    <div class="search-item" onclick="selectStudent('${s.LRN}')">
                        <div><strong>${s.Name}</strong><br><small>${s.Grade}-${s.Section}</small></div>
                        <span style="color:#007bff; font-weight:bold;">Select →</span>
                    </div>
                `).join('');
            } else {
                listDiv.style.display = 'none';
                playSound('error');
            }
        }

        async function selectStudent(lrn) {
            document.getElementById('searchList').style.display = 'none';
            document.getElementById('nameInput').value = "";
            const student = await db.students.get(lrn);
            if (student) {
                playSound('scan'); // High beep + vibrate
                activeStudent = student;
                document.getElementById('nameText').innerText = student.Name;
                document.getElementById('infoText').innerText = `Grade ${student.Grade} — ${student.Section}`;
                document.getElementById('scanResult').style.display = 'block';
                if(scanner && scanner.isScanning) scanner.pause(true);
            }
        }

        function initScanner() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('startBtn').style.display = 'none';
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => selectStudent(text.trim()));
        }

        function cancelScan() {
            document.getElementById('scanResult').style.display = 'none';
            activeStudent = null;
            if(scanner) scanner.resume();
        }

        async function saveRecord() {
            if(!activeStudent) return;
            const violation = document.getElementById('violationType').value;
            const now = Date.now();

            // PREVENTION LOGIC: Check if this exact student + violation was saved in the last 30 seconds
            const recentDuplicate = await db.logs
                .where('LRN').equals(activeStudent.LRN)
                .and(log => log.violation === violation && (now - log.timestamp) < 30000)
                .first();

            if (recentDuplicate) {
                playSound('error');
                alert("Duplicate entry prevented. This violation has already been recorded for this student.");
                return;
            }

            await db.logs.add({ 
                ...activeStudent, 
                violation: violation, 
                timestamp: now 
            });

            playSound('save'); // Lower beep, no vibration
            document.getElementById('scanResult').style.display = 'none';
            await refreshUI();
            if(scanner) scanner.resume();
        }

        async function uploadCSV() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = e.target.result.split("\n").slice(1);
                const data = rows.map(r => {
                    const c = r.split(",");
                    return c.length >= 4 ? { LRN: c[0].trim(), Name: c[1].trim(), Grade: c[2].trim(), Section: c[3].trim() } : null;
                }).filter(Boolean);
                await db.students.clear();
                await db.students.bulkPut(data);
                const count = await db.students.count();
                alert(`Successfully Updated! ${count} students in roster.`);
                await refreshUI();
            };
            reader.readAsText(file);
        }

        async function exportData() {
            const logs = await db.logs.toArray();
            if (logs.length === 0) return;
            
            // Format to Excel-friendly date string
            const exportData = logs.map(l => ({
                ...l,
                date: new Date(l.timestamp).toLocaleString()
            }));
            delete exportData.timestamp;

            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const yyyy = now.getFullYear();
            const fileName = `${mm}-${dd}-${yyyy}_Violation_Report.xlsx`;

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Report");
            XLSX.writeFile(wb, fileName);
        }

        async function clearLogs() { if (confirm("Clear all logs?")) { await db.logs.clear(); refreshUI(); } }
    </script>
</body>
</html>
